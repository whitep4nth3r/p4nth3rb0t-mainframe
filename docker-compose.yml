services:
  postgres:
    container_name: p4nth3rb0t-postgres
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: p4nth3rb0t
      POSTGRES_PASSWORD: supersecretpassword

  postgres-web:
    container_name: p4nth3rb0t-postgres-web
    image: sosedoff/pgweb
    restart: always
    depends_on:
      - postgres
    ports:
      - "5055:8081"
    environment:
      DATABASE_URL: postgres://p4nth3rb0t:supersecretpassword@postgres:5432/p4nth3rb0t?sslmode=disable
