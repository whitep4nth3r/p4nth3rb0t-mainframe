name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version in package.json
        run: |
          VERSION=$(jq -r .version package.json)
          NEW_VERSION=$(echo $VERSION | awk -F. '{$3=$3+1;print $1"."$2"."$3}')
          jq ".version=\"$NEW_VERSION\"" package.json > tmp.json && mv tmp.json package.json
          echo "OLD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUMPED_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Bump version in package-lock.json
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
      - run: npm i --package-lock-only

      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "Update release to v${{ env.BUMPED_VERSION }}"
          git push

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.BUMPED_VERSION }}
          release_name: v${{ env.BUMPED_VERSION }}
          body: "**Full Changelog**: https://github.com/whitep4nth3r/p4nth3rb0t-mainframe/compare/${{ env.OLD_VERSION }}...${{ env.BUMPED_VERSION }}"
          draft: false
          prerelease: false
